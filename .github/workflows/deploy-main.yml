# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║              🚀 Deploy Pipeline — Production (main branch)              ║
# ║  Test ──► Build Docker Image ──► Deploy to VPS ──► Health Check         ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

name: 🚀 Deploy to Production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  DOTNET_VERSION: |
    8.0.x
    10.0.x
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  IMAGE_NAME: ghcr.io/buidi2004/cloudservicestore-webapi

# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ┌─────────────────────────────────────────────────────────────────────────┐
  # │  🧪 Pre-Deploy Verification                                          │
  # └─────────────────────────────────────────────────────────────────────────┘
  test:
    name: 🧪 Pre-Deploy Tests
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📦 Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: 🔄 Restore
        run: dotnet restore CloudServiceStore/CloudServiceStore.Tests/CloudServiceStore.Tests.csproj

      - name: 🏗️ Build
        run: dotnet build CloudServiceStore/CloudServiceStore.WebApi/CloudServiceStore.WebApi.csproj --configuration Release --no-restore

      - name: 🧪 Run All Tests
        run: >
          dotnet test CloudServiceStore/CloudServiceStore.Tests/CloudServiceStore.Tests.csproj
          --configuration Release
          --verbosity normal
          --logger "trx;LogFileName=predeploy-results.trx"

      - name: 📊 Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: predeploy-test-results
          path: '**/predeploy-results.trx'
          retention-days: 30

  # ┌─────────────────────────────────────────────────────────────────────────┐
  # │  🐳 Build & Push Docker Image to GHCR                                │
  # └─────────────────────────────────────────────────────────────────────────┘
  docker-build:
    name: 🐳 Build Docker Image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}

      - name: 🏗️ Build & Push
        id: push
        uses: docker/build-push-action@v5
        with:
          context: ./CloudServiceStore
          file: ./CloudServiceStore/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📋 Image Summary
        run: |
          echo "### 🐳 Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Tags** | \`${{ steps.meta.outputs.tags }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Digest** | \`${{ steps.push.outputs.digest }}\` |" >> $GITHUB_STEP_SUMMARY

  # ┌─────────────────────────────────────────────────────────────────────────┐
  # │  🚀 Deploy to VPS via SSH                                            │
  # └─────────────────────────────────────────────────────────────────────────┘
  deploy:
    name: 🚀 Deploy to VPS
    needs: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://your-domain.example.com

    steps:
      - name: 🔌 Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            echo "═══════════════════════════════════════════════"
            echo "  🚀 Starting Production Deployment..."
            echo "═══════════════════════════════════════════════"

            echo "📂 1. Navigating to project directory..."
            cd /var/www/cloudservicestore

            echo "📥 2. Pulling latest code from main..."
            git fetch origin main
            git reset --hard origin/main

            echo "🐳 3. Pulling new Docker image & restarting..."
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull webapi
            docker compose up -d webapi

            echo "🧹 4. Cleaning up old images..."
            docker image prune -f

            echo "🏥 5. Running health check (max 60s)..."
            for i in {1..12}; do
              if curl -s -f http://localhost:5053/health > /dev/null; then
                echo "✅ Health check passed on attempt $i!"
                exit 0
              fi
              echo "⏳ Attempt $i/12 — retrying in 5s..."
              sleep 5
            done

            echo "❌ Health check failed after 60 seconds!"
            docker compose logs --tail=50 webapi
            exit 1

      - name: 📋 Deploy Summary
        if: success()
        run: |
          echo "### 🚀 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | Production |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Deployed at** | $(date -u +'%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY

      - name: ❌ Notify on failure
        if: failure()
        run: |
          echo "### ❌ Deployment Failed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Health check failed after 60s. Check VPS container logs." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Action Required:** SSH into VPS and run \`docker compose logs webapi\`" >> $GITHUB_STEP_SUMMARY
