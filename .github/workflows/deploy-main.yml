# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║              🚀 CD Pipeline — Deploy to VPS (main branch)               ║
# ║  1. Pre-Deploy Verify ─► 2. Build Docker GHCR ─► 3. SSH Deploy VPS       ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

name: 🚀 Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  DOTNET_VERSION: |
    8.0.x
    10.0.x
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  IMAGE_NAME: ghcr.io/buidi2004/cloudservicestore-webapi

# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ┌─────────────────────────────────────────────────────────────────────────┐
  # │  🧪 STAGE 1: Pre-Deploy Verification (Zero Regressions)                │
  # └─────────────────────────────────────────────────────────────────────────┘
  verify:
    name: 🧪 Pre-Deploy Verification
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📦 Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: 🔄 Restore
        run: dotnet restore CloudServiceStore/CloudServiceStore.Tests/CloudServiceStore.Tests.csproj

      - name: 🏗️ Build (Release)
        run: dotnet build CloudServiceStore/CloudServiceStore.Tests/CloudServiceStore.Tests.csproj --configuration Release --no-restore

      - name: 🧪 Run Fast Unit Tests
        run: >
          dotnet test CloudServiceStore/CloudServiceStore.Tests/CloudServiceStore.Tests.csproj
          --configuration Release
          --no-build
          --verbosity normal
          --filter "FullyQualifiedName~CloudServiceStore.Tests.Domain|FullyQualifiedName~CloudServiceStore.Tests.Application|FullyQualifiedName~CloudServiceStore.Tests.Infrastructure|FullyQualifiedName~CloudServiceStore.Tests.WebApi"

      - name: 📋 Verification Summary
        run: |
          echo "### 🧪 Pre-Deploy Verification: Passed" >> $GITHUB_STEP_SUMMARY
          echo "Code has passed build and 399 unit tests. Ready for container packaging." >> $GITHUB_STEP_SUMMARY

  # ┌─────────────────────────────────────────────────────────────────────────┐
  # │  🐳 STAGE 2: Build & Push Docker Image to GHCR                         │
  # └─────────────────────────────────────────────────────────────────────────┘
  docker-build:
    name: 🐳 Build & Push Docker Image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      image-tags: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔧 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Generate Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest
            type=raw,value=release-${{ github.run_number }}

      - name: 🏗️ Build and Push Multi-Platform Image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: ./CloudServiceStore
          file: ./CloudServiceStore/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📋 Docker Publish Summary
        run: |
          echo "### 🐳 Container Image Published to GHCR" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Attribute | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|:----------|:------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`${{ env.IMAGE_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Digest** | \`${{ steps.push.outputs.digest }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tags** | \`${{ steps.meta.outputs.tags }}\` |" >> $GITHUB_STEP_SUMMARY

  # ┌─────────────────────────────────────────────────────────────────────────┐
  # │  🚀 STAGE 3: Deploy to VPS via SSH & Run Health Checks                 │
  # └─────────────────────────────────────────────────────────────────────────┘
  deploy:
    name: 🚀 Deploy to VPS
    needs: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://your-domain.example.com

    steps:
      - name: 🔌 Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            echo "╔═══════════════════════════════════════════════════════════════╗"
            echo "║         🚀 STARTING VPS PRODUCTION DEPLOYMENT                 ║"
            echo "╚═══════════════════════════════════════════════════════════════╝"

            TARGET_DIR="/var/www/cloudservicestore"
            echo "📂 Target directory: $TARGET_DIR"

            if [ -d "$TARGET_DIR" ]; then
              cd "$TARGET_DIR"
              echo "📥 Fetching latest configurations from main branch..."
              git fetch origin main || true
              git reset --hard origin/main || true
            else
              echo "⚠️ Directory $TARGET_DIR not found, using current directory..."
            fi

            echo "🔐 Authenticating with GitHub Container Registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            echo "🐳 Pulling latest backend image..."
            docker compose pull webapi

            echo "🔄 Upgrading webapi container..."
            docker compose up -d --remove-orphans webapi

            echo "🧹 Cleaning unused dangling images..."
            docker image prune -f

            echo "🏥 Running Service Health Check on port 5053..."
            HEALTHY=false
            for attempt in $(seq 1 15); do
              echo "  Attempt $attempt/15: Checking http://localhost:5053/health..."
              if curl -s -f http://localhost:5053/health > /dev/null 2>&1; then
                echo "  ✅ Health check PASSED on attempt $attempt!"
                HEALTHY=true
                break
              fi
              sleep 4
            done

            echo "📋 Active Container Status:"
            docker compose ps

            if [ "$HEALTHY" = false ]; then
              echo "❌ Health check FAILED after 60s!"
              echo "📜 Container logs:"
              docker compose logs --tail=40 webapi
              exit 1
            fi

            echo "╔═══════════════════════════════════════════════════════════════╗"
            echo "║         🎉 DEPLOYMENT COMPLETED SUCCESSFULLY!                ║"
            echo "╚═══════════════════════════════════════════════════════════════╝"

      - name: 📋 Deployment Report
        if: success()
        run: |
          echo "## 🎉 Production Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|:----------|:------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Target Environment** | Production VPS |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit SHA** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Deployed Image** | \`${{ env.IMAGE_NAME }}:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Health Endpoint** | \`http://localhost:5053/health\` (200 OK) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Timestamp** | $(date -u +'%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY

      - name: ❌ Deployment Failure Report
        if: failure()
        run: |
          echo "## ❌ Production Deployment Failed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> ⚠️ **Health check timed out or SSH command failed on VPS.**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next Steps:**" >> $GITHUB_STEP_SUMMARY
          echo "1. SSH into VPS: \`ssh user@vps_host\`" >> $GITHUB_STEP_SUMMARY
          echo "2. Check logs: \`cd /var/www/cloudservicestore && docker compose logs -n 50 webapi\`" >> $GITHUB_STEP_SUMMARY
          echo "3. Verify DB connection string and secrets in \`.env\`" >> $GITHUB_STEP_SUMMARY
