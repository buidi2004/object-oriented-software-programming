name: CI Develop

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x' # Sửa thành phiên bản .NET bạn đang dùng (VD: 8.0)

      - name: Restore dependencies
        run: dotnet restore CloudServiceStore/CloudServiceStore.WebApi/CloudServiceStore.WebApi.csproj

      - name: Build
        run: dotnet build CloudServiceStore/CloudServiceStore.WebApi/CloudServiceStore.WebApi.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test CloudServiceStore/CloudServiceStore.Tests/CloudServiceStore.Tests.csproj --verbosity normal
