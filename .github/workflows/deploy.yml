name: Deploy Container to VPS

on:
  push:
    branches:
      - main # Chỉ deploy khi code được push/merge vào main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Execute SSH Commands on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            echo "1. Di chuyển vào thư mục dự án..."
            cd /var/www/cloudservicestore
            
            echo "2. Kéo code mới nhất từ nhánh main..."
            git reset --hard
            git pull origin main
            
            echo "3. Build lại Image và khởi chạy Container Backend bằng Docker Compose..."
            # Lệnh này sẽ build lại Dockerfile của webapi và chạy container mới (port 5053)
            docker compose up -d --build webapi
            
            echo "4. Dọn dẹp các image cũ không còn sử dụng (Tùy chọn để nhẹ VPS)..."
            docker image prune -f
            
            echo "✅ Triển khai Backend Container lên VPS thành công!"
